<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">

  <title>Sign In | Vanguard Mark</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #080b12;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 7%;
      border-bottom: 1px solid #222a35;
    }

    .brand {
      color: #d6b36a;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 34px 28px;
      background: #101722;
      border: 1px solid #283342;
      border-radius: 12px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.25);
    }

    .eyebrow {
      color: #d6b36a;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: 30px;
    }

    .intro {
      color: #aeb8c7;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: #e1e5ec;
      font-size: 13px;
    }

    input {
      width: 100%;
      padding: 14px;
      color: #ffffff;
      background: #090e16;
      border: 1px solid #303b4a;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #d6b36a;
    }

    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      background: #d6b36a;
      color: #080b12;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e8c982;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .forgot {
      display: block;
      margin-top: 16px;
      color: #d6b36a;
      text-align: right;
      font-size: 13px;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #ffb4b4;
      background: #321b20;
    }

    .message.success {
      display: block;
      color: #b9f6ca;
      background: #14291d;
    }

    .switch {
      margin-top: 25px;
      color: #aeb8c7;
      text-align: center;
      font-size: 13px;
    }

    a {
      color: #d6b36a;
    }

    footer {
      padding: 22px;
      color: #7f8998;
      border-top: 1px solid #222a35;
      text-align: center;
      font-size: 12px;
    }

    footer a {
      margin: 0 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <header>
    <a class="brand" href="index.html">VANGUARD MARK</a>
  </header>

  <main>
    <section class="card">
      <div class="eyebrow">Member Access</div>
      <h1>Welcome back.</h1>

      <p class="intro">
        Sign in to access your Vanguard Mark account and continue where you left off.
      </p>

      <form id="signInForm">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button id="signInButton" type="submit">Sign In</button>
      </form>

      <a href="#" class="forgot" id="forgotPassword">
        Forgot your password?
      </a>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div class="switch">
        New to Vanguard Mark?
        <a href="sign-up.html">Create an account</a>
      </div>
    </section>
  </main>

  <footer>
    &copy; 2026 Vanguard Mark
    <br><br>
    <a href="competition-terms.html">Terms</a>
    <a href="privacy.html">Privacy</a>
    <a href="refund-policy.html">Refund Policy</a>
  </footer>

  <script type="module">
    import { initializeApp, getApp, getApps }
      from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBUnCzLbflld7ghgctjdUOQFpCc6AGz8jA",
      authDomain: "vanguard-mark.firebaseapp.com",
      projectId: "vanguard-mark",
      appId: "1:559500853316:web:28ee5109734c5aa1303c11"
    };

    const app = getApps().length
      ? getApp()
      : initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const form = document.getElementById("signInForm");
    const button = document.getElementById("signInButton");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const forgotPassword = document.getElementById("forgotPassword");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    function friendlyError(error) {
      const errors = {
        "auth/invalid-email": "Please enter a valid email address.",
        "auth/invalid-credential": "The email or password is incorrect.",
        "auth/user-not-found": "The email or password is incorrect.",
        "auth/wrong-password": "The email or password is incorrect.",
        "auth/too-many-requests": "Too many attempts. Please try again later.",
        "auth/network-request-failed": "Connection failed. Check your internet and try again.",
        "auth/user-disabled": "This account has been disabled."
      };

      return errors[error.code] || "Sign-in failed. Please try again.";
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.replace("dashboard.html");
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing In...";

      try {
        await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );

        showMessage("Sign-in successful. Opening your dashboard...", "success");
        window.location.href = "dashboard.html";
      } catch (error) {
        showMessage(friendlyError(error));
      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });

    forgotPassword.addEventListener("click", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Enter your email address first, then select Forgot your password.");
        emailInput.focus();
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        showMessage(
          "If an account exists for that address, a password-reset email will be sent.",
          "success"
        );
      } catch (error) {
        if (error.code === "auth/invalid-email") {
          showMessage("Please enter a valid email address.");
        } else {
          showMessage(
            "We couldn't send the reset email. Check your address and try again."
          );
        }
      }
    });
  </script>
</body>
          </html>
