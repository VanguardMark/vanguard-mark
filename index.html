<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d18">
<meta name="description" content="Vanguard Mark is a premium logo design competition platform. Discover the competition, explore the rules, and prepare your original design.">
<title>Vanguard Mark — A New Standard in Design</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080d18;
  --bg-soft: #0c1322;
  --panel: #101a2b;
  --panel-light: #152137;
  --gold: #d8b46a;
  --gold-light: #f0d69b;
  --white: #f7f7f5;
  --muted: #a0aabd;
  --line: rgba(255,255,255,.10);
  --gold-line: rgba(216,180,106,.28);
  --serif: Georgia, "Times New Roman", serif;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 100px;
}

body {
  margin: 0;
  color: var(--white);
  background: var(--bg);
  font-family: "DM Sans", Arial, sans-serif;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 80% 12%, rgba(216,180,106,.055), transparent 35%),
    radial-gradient(ellipse at 0% 50%, rgba(40,68,112,.10), transparent 35%);
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

.container {
  width: min(1160px, calc(100% - 48px));
  margin: 0 auto;
}

/* NAVIGATION */

.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(8,13,24,.91);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--line);
}

.navbar {
  min-height: 84px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 13px;
  flex-shrink: 0;
}

.brand-mark {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: var(--serif);
  font-size: 25px;
  position: relative;
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(216,180,106,.32);
}

.brand-name {
  font-family: "Manrope", sans-serif;
  font-size: 14px;
  line-height: 1.35;
  font-weight: 800;
  letter-spacing: 2px;
}

.brand-name span {
  display: block;
  color: var(--gold);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-links > a:not(.btn) {
  color: #c0c7d3;
  font-size: 13px;
  transition: color .2s;
}

.nav-links > a:not(.btn):hover {
  color: var(--gold-light);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  min-height: 47px;
  padding: 12px 21px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 11px;
  border: 1px solid transparent;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  transition:
    background .25s,
    border-color .25s,
    color .25s,
    transform .25s;
}

.btn:hover {
  transform: translateY(-2px);
}

.btn-gold {
  background: var(--gold);
  color: #12110d;
}

.btn-gold:hover {
  background: var(--gold-light);
}

.btn-outline {
  border-color: rgba(255,255,255,.2);
  color: var(--white);
  background: transparent;
}

.btn-outline:hover {
  border-color: var(--gold);
  color: var(--gold-light);
}

.btn-dark {
  border-color: var(--gold-line);
  background: rgba(216,180,106,.06);
  color: var(--gold-light);
}

.btn-full {
  width: 100%;
}

.mobile-toggle {
  display: none;
  width: 44px;
  height: 44px;
  border: 1px solid var(--line);
  color: var(--white);
  background: transparent;
  font-size: 23px;
}

/* HERO */

.hero {
  min-height: 690px;
  padding: 108px 0 94px;
  position: relative;
  overflow: hidden;
}

.hero::after {
  content: "V";
  position: absolute;
  right: -25px;
  top: 8px;
  color: rgba(216,180,106,.025);
  font-family: var(--serif);
  font-size: clamp(400px, 58vw, 780px);
  line-height: 1;
  pointer-events: none;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  align-items: center;
  gap: 80px;
  position: relative;
  z-index: 1;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--gold);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.eyebrow::before {
  content: "";
  width: 28px;
  height: 1px;
  background: var(--gold);
}

.hero h1 {
  margin: 30px 0 25px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(52px, 6.3vw, 82px);
  line-height: 1.04;
  letter-spacing: -3px;
}

.hero h1 em {
  color: var(--gold);
  font-weight: 400;
}

.hero-copy {
  max-width: 510px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 33px;
}

.hero-footnote {
  margin-top: 26px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: #7f8b9f;
  font-size: 11px;
}

.status-dot {
  width: 7px;
  height: 7px;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--gold);
}

/* PRIZE FEATURE */

.prize-wrap {
  position: relative;
  padding: 15px 0;
}

.prize-card {
  padding: 36px;
  border: 1px solid var(--gold-line);
  background:
    radial-gradient(ellipse at 100% 0%, rgba(216,180,106,.12), transparent 50%),
    linear-gradient(145deg, rgba(20,31,49,.98), rgba(11,18,31,.98));
  position: relative;
}

.prize-card::before,
.prize-card::after {
  content: "";
  position: absolute;
  width: 42px;
  height: 42px;
  pointer-events: none;
}

.prize-card::before {
  top: -5px;
  left: -5px;
  border-top: 1px solid var(--gold);
  border-left: 1px solid var(--gold);
}

.prize-card::after {
  right: -5px;
  bottom: -5px;
  border-right: 1px solid var(--gold);
  border-bottom: 1px solid var(--gold);
}

.prize-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.prize-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.prize-index {
  color: var(--gold);
  font-family: var(--serif);
  font-size: 15px;
}

.prize-amount {
  margin: 22px 0 0;
  color: var(--gold-light);
  font-family: var(--serif);
  font-size: clamp(49px, 5.7vw, 75px);
  line-height: 1.12;
  letter-spacing: -3px;
}

.prize-caption {
  color: #d0d5df;
  font-size: 13px;
  margin: 13px 0 28px;
}

.prize-rule {
  height: 1px;
  background: var(--line);
  margin: 25px 0;
}

.prize-detail {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin: 15px 0;
  font-size: 12px;
}

.prize-detail span {
  color: var(--muted);
}

.prize-detail strong {
  font-weight: 600;
  text-align: right;
}

.prize-disclaimer {
  margin-top: 24px;
  padding: 12px 14px;
  border-left: 2px solid var(--gold);
  background: rgba(216,180,106,.055);
  color: #c0b79f;
  font-size: 10px;
  line-height: 1.8;
}

/* TRUST STRIP */

.trust-strip {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.012);
}

.trust-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
}

.trust-item {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 27px 28px;
  border-right: 1px solid var(--line);
}

.trust-item:first-child {
  padding-left: 0;
}

.trust-item:last-child {
  border-right: 0;
}

.trust-number {
  color: var(--gold);
  font-family: var(--serif);
  font-size: 27px;
}

.trust-title {
  font-size: 12px;
  font-weight: 700;
}

.trust-subtitle {
  color: var(--muted);
  font-size: 10px;
}

/* GENERAL SECTIONS */

.section {
  padding: 105px 0;
}

.section-heading {
  max-width: 650px;
  margin-bottom: 48px;
}

.section-heading h2 {
  margin: 20px 0 17px;
  font-family: var(--serif);
  font-size: clamp(36px,4.7vw,55px);
  font-weight: 400;
  line-height: 1.15;
  letter-spacing: -1.4px;
}

.section-heading h2 em {
  color: var(--gold);
  font-weight: 400;
}

.section-heading p {
  max-width: 550px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.9;
}

.center-heading {
  text-align: center;
  margin-left: auto;
  margin-right: auto;
}

.center-heading .eyebrow {
  justify-content: center;
}

.center-heading .section-heading p,
.center-heading p {
  margin-left: auto;
  margin-right: auto;
}

/* HOW IT WORKS */

.process-section {
  background: linear-gradient(180deg, rgba(12,19,34,.35), rgba(12,19,34,.8));
  border-bottom: 1px solid var(--line);
}

.process-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 22px;
}

.process-card {
  min-height: 255px;
  padding: 30px;
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(18,29,47,.85), rgba(10,17,29,.9));
  position: relative;
  transition: border-color .3s, transform .3s;
}

.process-card:hover {
  border-color: var(--gold-line);
  transform: translateY(-5px);
}

.process-number {
  color: var(--gold);
  font-family: var(--serif);
  font-size: 33px;
}

.process-card h3 {
  margin: 29px 0 11px;
  font-family: "Manrope", sans-serif;
  font-size: 17px;
  font-weight: 600;
}

.process-card p {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

/* SUBMISSION */

.submission-section {
  background: var(--bg);
}

.submission-grid {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 80px;
  align-items: start;
}

.submission-intro {
  position: sticky;
  top: 125px;
}

.submission-intro .section-heading {
  margin-bottom: 25px;
}

.submission-points {
  list-style: none;
  margin: 30px 0 0;
  padding: 0;
}

.submission-points li {
  display: flex;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  color: #c4cbd6;
  font-size: 12px;
}

.submission-points li span {
  color: var(--gold);
}

.submission-form {
  padding: 35px;
  border: 1px solid var(--gold-line);
  background: linear-gradient(145deg, #111b2c, #0c1423);
}

.form-heading {
  padding-bottom: 23px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 24px;
}

.form-heading h3 {
  margin: 0;
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 400;
}

.form-heading p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
}

.form-group {
  margin: 20px 0;
}

.form-group label,
.agreement-label {
  display: block;
  margin-bottom: 9px;
  color: #dce0e7;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
}

.form-group input,
.form-group textarea {
  display: block;
  width: 100%;
  border: 1px solid #2b374b;
  border-radius: 2px;
  background: #0a1120;
  color: var(--white);
  padding: 14px 15px;
  outline: none;
  transition: border-color .2s;
}

.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--gold);
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #69758a;
}

.form-group textarea {
  min-height: 105px;
  resize: vertical;
}

.form-group input[type="file"] {
  padding: 12px;
  font-size: 11px;
}

.form-group input[type="file"]::file-selector-button {
  margin-right: 12px;
  padding: 9px 12px;
  border: 0;
  background: var(--panel-light);
  color: var(--gold-light);
  cursor: pointer;
}

.image-preview {
  display: none;
  min-height: 150px;
  margin-top: 13px;
  padding: 12px;
  border: 1px dashed #39445a;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.image-preview img {
  display: block;
  max-width: 100%;
  max-height: 260px;
  object-fit: contain;
}

.agreement-label {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin: 24px 0;
  color: var(--muted);
  line-height: 1.8;
  font-weight: 400;
}

.agreement-label input {
  accent-color: var(--gold);
  flex-shrink: 0;
  margin-top: 5px;
}

.form-note {
  color: #8d99ad;
  font-size: 10px;
  line-height: 1.8;
  margin-top: 16px;
}

/* RULES */

.rules-section {
  background: #0b1220;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.rules-grid {
  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 85px;
}

.rules-list {
  border-top: 1px solid var(--line);
}

.rule-item {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 15px;
  padding: 23px 0;
  border-bottom: 1px solid var(--line);
}

.rule-number {
  color: var(--gold);
  font-family: var(--serif);
  font-size: 19px;
}

.rule-item h3 {
  margin: 0 0 6px;
  font-size: 13px;
  font-weight: 600;
}

.rule-item p {
  margin: 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.9;
}

/* FAQ */

.faq-layout {
  display: grid;
  grid-template-columns: .75fr 1.25fr;
  gap: 85px;
}

.faq-list details {
  border-bottom: 1px solid var(--line);
}

.faq-list details:first-child {
  border-top: 1px solid var(--line);
}

.faq-list summary {
  list-style: none;
  cursor: pointer;
  padding: 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  font-size: 13px;
  font-weight: 600;
}

.faq-list summary::-webkit-details-marker {
  display: none;
}

.faq-list summary::after {
  content: "+";
  color: var(--gold);
  font-size: 21px;
  font-weight: 400;
}

.faq-list details[open] summary::after {
  content: "−";
}

.faq-list details p {
  padding: 0 28px 20px 0;
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

/* FOOTER */

.site-footer {
  background: #060a12;
  border-top: 1px solid var(--line);
  padding: 62px 0 24px;
}

.footer-main {
  display: grid;
  grid-template-columns: 1.3fr .7fr .7fr;
  gap: 60px;
  padding-bottom: 48px;
}

.footer-description {
  max-width: 310px;
  margin-top: 20px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.footer-column h3 {
  margin: 0 0 18px;
  color: var(--gold);
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.footer-column a {
  display: block;
  width: fit-content;
  margin: 12px 0;
  color: #aeb7c6;
  font-size: 12px;
  transition: color .2s;
}

.footer-column a:hover {
  color: var(--gold-light);
}

.footer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-top: 22px;
  border-top: 1px solid var(--line);
  color: #7f8a9d;
  font-size: 10px;
}

.footer-bottom a {
  color: #b9c0cc;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  padding: 20px;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.82);
  backdrop-filter: blur(8px);
}

.modal-content {
  width: min(460px,100%);
  padding: 34px;
  border: 1px solid var(--gold-line);
  background: #101a2b;
  box-shadow: 0 25px 100px rgba(0,0,0,.4);
}

.modal-close {
  float: right;
  width: 35px;
  height: 35px;
  border: 1px solid var(--line);
  background: transparent;
  color: white;
  font-size: 20px;
}

.modal-content h2 {
  clear: both;
  padding-top: 20px;
  font-family: var(--serif);
  font-size: 31px;
  font-weight: 400;
}

.modal-content p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.9;
}

.modal-actions {
  display: grid;
  gap: 12px;
  margin-top: 25px;
}

.modal-note {
  padding: 12px;
  border-left: 2px solid var(--gold);
  background: rgba(216,180,106,.06);
  color: #c9c0ad;
  font-size: 10px;
  line-height: 1.8;
}

/* ANIMATIONS */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-copy-block {
  animation: fadeUp .8s ease both;
}

.prize-wrap {
  animation: fadeUp 1s .12s ease both;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* RESPONSIVE */

@media (max-width: 980px) {
  .nav-links {
    gap: 17px;
  }

  .hero-grid {
    gap: 40px;
  }

  .hero h1 {
    font-size: clamp(48px,7vw,68px);
  }

  .submission-grid,
  .rules-grid,
  .faq-layout {
    gap: 45px;
  }

  .footer-main {
    gap: 35px;
  }
}

@media (max-width: 760px) {
  .container {
    width: calc(100% - 36px);
  }

  .navbar {
    min-height: 72px;
  }

  .brand-mark {
    width: 39px;
    height: 39px;
  }

  .brand-name {
    font-size: 12px;
    letter-spacing: 1.5px;
  }

  .mobile-toggle {
    display: grid;
    place-items: center;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 72px;
    left: 0;
    right: 0;
    padding: 22px 22px 26px;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    border-bottom: 1px solid var(--line);
    background: #0a1120;
  }

  .nav-links.open {
    display: flex;
  }

  .nav-links > a:not(.btn) {
    display: block;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
  }

  .nav-links .btn {
    margin-top: 15px;
  }

  .nav-actions {
    display: none;
  }

  .hero {
    min-height: auto;
    padding: 72px 0 60px;
  }

  .hero-grid {
    grid-template-columns: 1fr;
    gap: 48px;
  }

  .hero h1 {
    margin-top: 25px;
    font-size: clamp(48px,12vw,70px);
    letter-spacing: -2px;
  }

  .hero-copy {
    font-size: 14px;
  }

  .prize-wrap {
    max-width: 510px;
  }

  .prize-card {
    padding: 27px;
  }

  .prize-amount {
    font-size: clamp(54px,14vw,72px);
  }

  .trust-grid {
    grid-template-columns: 1fr;
  }

  .trust-item,
  .trust-item:first-child {
    padding: 19px 4px;
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .trust-item:last-child {
    border-bottom: 0;
  }

  .trust-number {
    width: 42px;
  }
